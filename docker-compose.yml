version: "3.8"

services:
  app:
    build: .
    ports:
      - "80:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DATABASE=blowing_machine
      - PG_USER=blowing
      - PG_PASSWORD=blowing123
      - TZ=Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=blowing_machine
      - POSTGRES_USER=blowing
      - POSTGRES_PASSWORD=blowing123
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blowing -d blowing_machine"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
