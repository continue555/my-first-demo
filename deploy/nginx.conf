# 吹瓶机管理系统 - Nginx 反向代理配置
# 将本文件放到服务器: /etc/nginx/sites-available/blowing-machine
# 然后运行: ln -s /etc/nginx/sites-available/blowing-machine /etc/nginx/sites-enabled/
# 最后: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # 如果绑定了域名，替换为你的域名

    # 客户端上传大小限制
    client_max_body_size 10m;

    # 日志
    access_log /var/log/nginx/blowing-machine-access.log;
    error_log /var/log/nginx/blowing-machine-error.log;

    # 代理到 Node.js 应用
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}